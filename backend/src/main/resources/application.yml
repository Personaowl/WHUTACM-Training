server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true

spring:
  application:
    name: training-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${MYSQL_URL:jdbc:mysql://localhost:3306/whut_training?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
    username: "${MYSQL_USERNAME:root}"
    password: "${MYSQL_PASSWORD:123456}"
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 10000
  task:
    scheduling:
      pool:
        size: 3
      thread-name-prefix: whut-scheduler-
  lifecycle:
    timeout-per-shutdown-phase: 20s

codeforces:
  base_url: https://codeforces.com/api
  profile-cache-minutes: 30
  request-interval-ms: 2100
  max-pending-requests: 200
  request-timeout-ms: 30000

contests:
  cache-minutes: 15
  codeforces-url: https://codeforces.com/api/contest.list?gym=false
  atcoder-url: https://atcoder.jp/contests/?lang=en
  nowcoder-url: https://ac.nowcoder.com/acm/contest/vip-index
  luogu-url: https://www.luogu.com.cn/contest/list

atcoder:
  origin: https://atcoder.jp

atcoder-problems:
  submissions-url: https://kenkoooo.com/atcoder/atcoder-api/v3/user/submissions

superAdmin:
  username: superadmin
  password: superadmin123

app:
  security:
    allow-insecure-http: "${ALLOW_INSECURE_HTTP:false}"
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
  home:
    cache-ms: 3000
  database:
    type: mysql
  logging:
    service:
      enabled: true
  auth:
    access-token-ttl-seconds: "${ACCESS_TOKEN_TTL_SECONDS:7200}"
    refresh-token-ttl-seconds: "${REFRESH_TOKEN_TTL_SECONDS:21600}"
  daily-problem:
    initial-sync-enabled: true
    min-rating: 1200
    max-rating: 2000
    easy-min-rating: 800
    easy-max-rating: 1800
    hard-min-rating: 1900
    hard-max-rating: 3000
    no-repeat-days: 90
    cron: "0 5 0 * * *"
    sync-cron: "0 0 0 * * MON"
    zone: "Asia/Shanghai"
  daily:
    historyRetentionDays: 0
  atcoder-tracking:
    fixed-delay-ms: 1800000
    initial-delay-ms: 30000
  daily-check-in:
    cleanup-delay-ms: 600000

logging:
  level:
    com.whut.training.interceptor.RequestLoggingInterceptor: INFO
    com.whut.training.aspect.logging.ServiceLogAspect: INFO
